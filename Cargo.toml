[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clothes3d-core = { path = "crates/clothes3d-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The desktop app lives at the workspace root so `cargo run` keeps working.
[package]
name = "clothes3d"
version.workspace = true
edition.workspace = true

[dependencies]
clothes3d-core.workspace = true
eframe = { version = "0.36.2", features = ["persistence"] }
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
