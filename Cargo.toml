[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clothes3d-core = { path = "crates/clothes3d-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The desktop app lives at the workspace root so `cargo run` keeps working.
[package]
name = "clothes3d"
version.workspace = true
edition.workspace = true

[dependencies]
ab_glyph = "0.2.32"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
base64 = "0.23.1"
clothes3d-core.workspace = true
eframe = { version = "0.36.2", features = ["persistence"] }
epaint_default_fonts = "0.36.2"
rfd = "0.17.2"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tiny-skia = "0.12.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "sync", "macros"] }
tokio-util = "0.7.20"

[dev-dependencies]
ron = "0.12"
